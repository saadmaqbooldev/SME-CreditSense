<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>CreditSense — Application Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css?v=2" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="app.js?v=2"></script>
</head>
<body>
<a href="#main" class="sr-only">Skip to content</a>

<nav class="nav" aria-label="Main">
  <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">CS</span> CreditSense</a>
  <a href="index.html" class="navlink">Work Queue</a>
  <a href="regulations.html" class="navlink">Regulations</a>
  <a href="portfolio.html" class="navlink">Portfolio</a>
  <a href="audit.html" class="navlink">Audit Trail</a>
</nav>

<main id="main" class="shell shell-xl">
  <header class="page-head rise">
    <a href="index.html" class="btn-link" style="display:inline-block;margin-bottom:.6rem">← Back to Work Queue</a>
    <h1 id="page-title" class="h1"><span class="gradient-text">Application Review</span></h1>
    <p id="page-subtitle" class="lede" style="margin:.5rem 0 0"></p>
  </header>

  <div id="content" class="grid grid-cols-1 lg:grid-cols-3" style="gap:1.1rem;align-items:start"></div>
</main>

<script>
const { el, rise, fetchJSON, skeleton, errorState, verdictBadge, sourceBadge, card,
        unresolvedBadge, originBadge, animateTo, fmtPKR, fmtDate, toast,
        confirmDialog, promptDialog } = CS;

const params = new URLSearchParams(location.search);
const applicantIdParam = params.get("applicant_id");
const decisionIdParam = params.get("id");
const shouldRun = params.get("run") === "1";
const isSessionSource = params.get("source") === "session";

const STAGES = [
  { key: "analyze", label: "Financial analyst", detail: "Reading the application" },
  { key: "score", label: "Risk scoring", detail: "Scoring credit risk" },
  { key: "check", label: "Compliance check", detail: "Checking SBP regulations" },
  { key: "decide", label: "Supervisor decision", detail: "Applying the approval guardrail" },
];

let rawDocument = null;
let applicantId = applicantIdParam;

function setTitle(text) {
  document.getElementById("page-title").innerHTML = "";
  document.getElementById("page-title").appendChild(el("span", { class: "gradient-text" }, text));
}

// Each state carries an icon and a spoken word as well as its colour, so a colourblind
// officer reads the same trace (FRONTEND_REQUIREMENTS.md §3.1).
const STAGE_STATE = {
  pending:  { icon: "○", word: "Pending" },
  running:  { icon: "◐", word: "Running" },
  complete: { icon: "✓", word: "Done" },
  failed:   { icon: "✕", word: "Failed" },
};

function stageCard(stage, state, meta) {
  const s = STAGE_STATE[state] || STAGE_STATE.pending;
  return el(
    "div", { class: `stage stage-${state}`, id: `stage-${stage.key}` },
    el("span", { class: "stage-icon", "aria-hidden": "true" }, s.icon),
    el("div", { class: "stage-body" },
      el("div", { class: "stage-name" }, stage.label, el("span", { class: "sr-only" }, ` — ${s.word}`)),
      el("div", { class: "stage-note" }, (meta && meta.summary) || stage.detail)
    ),
    meta && meta.duration_ms !== undefined ? el("span", { class: "stage-time" }, `${meta.duration_ms} ms`) : null
  );
}

function renderTrace(container, stageStates) {
  container.innerHTML = "";
  STAGES.forEach((s, i) => container.appendChild(
    rise(stageCard(s, stageStates[s.key].state, stageStates[s.key].meta), i)));
}

function stageSummary(stage, fields) {
  if (stage === "analyze") return `${fields.unresolved_fields || 0} unresolved field(s)`;
  if (stage === "score") return fields.default_probability != null ? `Default probability ${(fields.default_probability * 100).toFixed(1)}%` : "Unavailable -- escalating";
  if (stage === "check") return `${fields.breach_count || 0} breach(es), ${fields.advisory_count || 0} advisory`;
  if (stage === "decide") return `Verdict: ${fields.decision}`;
  return "";
}

function riskGauge(risk) {
  if (!risk) {
    return el("div", { class: "alert alert-warn" },
      el("span", { class: "alert-icon", "aria-hidden": "true" }, "!"),
      el("span", {}, "Risk score unavailable — escalated to a human."));
  }
  const p = Math.min(1, Math.max(0, risk.default_probability));
  const cutoff = Math.min(1, Math.max(0, risk.decision_cutoff));
  const safe = p <= cutoff;

  const needle = el("div", { class: "gauge-needle", style: "left:0%" });
  const gauge = el("div", {
    class: "gauge",
    role: "img",
    "aria-label": `Default probability ${(p * 100).toFixed(1)} percent against a cutoff of ${(cutoff * 100).toFixed(1)} percent`,
  },
    el("div", { class: "gauge-safe", style: `width:${cutoff * 100}%` }),
    el("div", { class: "gauge-risk", style: `left:${cutoff * 100}%` }),
    el("div", { class: "gauge-cutoff", style: `left:${cutoff * 100}%`, title: "Cutoff" }),
    needle
  );
  animateTo(needle, "left", `${p * 100}%`);

  return el("div", { class: "stack-sm" },
    el("div", { style: "display:flex;align-items:center;gap:.5rem;flex-wrap:wrap" },
      el("span", { class: `badge ${safe ? "badge-ok" : "badge-bad"}` },
        el("span", { "aria-hidden": "true" }, safe ? "✓" : "▲"),
        el("span", {}, safe ? "Below cutoff" : "Above cutoff")),
      el("span", { class: "num", style: "margin-left:auto;font-weight:650" }, `${(p * 100).toFixed(1)}%`)
    ),
    gauge,
    el("div", { style: "display:flex;justify-content:space-between;font-size:.76rem;color:var(--text-muted)" },
      el("span", { class: "num" }, `Default probability ${(p * 100).toFixed(1)}%`),
      el("span", { class: "num" }, `Cutoff ${(cutoff * 100).toFixed(1)}%`)
    ),
    el("p", { style: "margin:.3rem 0 0;font-size:.845rem;line-height:1.6;color:var(--text-muted)" }, risk.narrative)
  );
}

function complianceBlock(compliance) {
  if (!compliance) {
    return el("div", { class: "alert" },
      el("span", { class: "alert-icon", "aria-hidden": "true" }, "○"),
      el("span", {}, "Compliance check did not run."));
  }
  const wrap = el("div", { class: "stack-sm" });
  if (compliance.insufficient_data) {
    wrap.appendChild(el("div", { class: "alert alert-warn" },
      el("span", { class: "alert-icon", "aria-hidden": "true" }, "!"),
      el("span", {}, "Couldn't verify compliance fully — treated as unresolved, never as a clean pass.")));
  }
  const breaches = compliance.flags.filter((f) => f.severity === "BREACH");
  const advisories = compliance.flags.filter((f) => f.severity === "ADVISORY");
  [...breaches, ...advisories].forEach((f, i) => {
    const isBreach = f.severity === "BREACH";
    const citation = f.citations[0];
    wrap.appendChild(rise(el(
      "div", { class: "card card-pad", style: isBreach
        ? "border-color:rgba(244,63,94,.45);background:var(--bad-bg)"
        : "" },
      el("div", { style: "display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem" },
        el("span", { class: "mono", style: "font-weight:650;font-size:.82rem" }, f.rule_id),
        el("span", { class: `badge ${isBreach ? "badge-bad" : "badge-solid"}` },
          el("span", { "aria-hidden": "true" }, isBreach ? "▲" : "i"),
          el("span", {}, f.severity)),
        originBadge(f.origin)
      ),
      el("p", { style: "margin:0 0 .4rem;font-size:.855rem;line-height:1.55" }, f.summary),
      citation ? el("a", { href: `regulations.html?number=${encodeURIComponent(citation.regulation_number)}`,
                           class: "btn-link" },
                     `View ${citation.regulation_number}: ${citation.clause_title} →`) : null
    ), i));
  });
  if (compliance.flags.length === 0 && !compliance.insufficient_data) {
    wrap.appendChild(el("div", { class: "alert alert-ok" },
      el("span", { class: "alert-icon", "aria-hidden": "true" }, "✓"),
      el("span", {}, "No compliance flags raised.")));
  }
  return wrap;
}

function parsedPanel(parsed) {
  if (!parsed) return el("p", { class: "muted", style: "margin:0;font-size:.85rem" }, "Parsed data unavailable.");
  const rows = el("div", {});
  Object.entries(parsed.fields).forEach(([k, v]) => {
    rows.appendChild(el("div", { class: "kv" },
      el("span", { class: "kv-key" }, k),
      el("span", { class: "kv-val" },
        el("span", { class: "mono", style: "font-weight:550" }, String(v)),
        sourceBadge(parsed.field_sources[k])
      )
    ));
  });
  parsed.unresolved_fields.forEach((k) => {
    rows.appendChild(el("div", { class: "kv" },
      el("span", { class: "kv-key" }, k),
      el("span", { class: "kv-val" }, el("span", { class: "mono dim" }, "—"), unresolvedBadge())
    ));
  });
  const wrap = el("div", {}, rows);
  if (parsed.note_insights) {
    const ni = parsed.note_insights;
    wrap.appendChild(el("div", { class: "alert", style: "margin-top:.9rem;flex-direction:column;gap:.35rem" },
      el("div", { class: "stat-label" }, "Officer's note"),
      el("p", { style: "margin:0;font-size:.85rem;line-height:1.6" }, ni.summary_english || "(no summary)"),
      el("p", { class: "hint", style: "margin:0" },
        `Seasonality: ${ni.seasonality ? "yes" : "no"}` + (ni.seasonal_peak ? `, peak: ${ni.seasonal_peak}` : ""))
    ));
  }
  return wrap;
}

function asReceivedPanel(doc) {
  if (!doc) {
    return el("p", { class: "muted", style: "margin:0;font-size:.85rem;line-height:1.6" },
      "No uploaded document on file — underwritten from the applicant's own record.");
  }
  const rows = el("div", {});
  Object.entries(doc.raw_fields).forEach(([k, v]) => {
    rows.appendChild(el("div", { class: "kv" },
      el("span", { class: "kv-key mono" }, k),
      el("span", { class: "kv-val mono" }, v === null ? el("span", { class: "dim" }, "null") : String(v))
    ));
  });
  const wrap = el("div", {}, rows);
  if (doc.notes) {
    wrap.appendChild(el("blockquote", {
      style: "margin:.9rem 0 0;padding:.7rem .9rem;font-size:.85rem;font-style:italic;line-height:1.6;" +
             "border-left:3px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;" +
             "background:var(--surface);color:var(--text-muted)",
    }, `“${doc.notes}”`));
  }
  return wrap;
}

function inferStageStatesFromDecision(decision) {
  // Used for stored decisions (no live SSE trace was captured) -- reconstructed from
  // what the decision object itself proves did or didn't happen, never assumed
  // complete. A missing `risk`/`compliance` means that stage genuinely did not
  // finish (pipeline.py only calls compliance.check() when risk is not None), not
  // that this page failed to load its data.
  const states = {};
  states.analyze = { state: "complete", meta: { summary: "Application read" } };
  states.score = decision.risk
    ? { state: "complete", meta: { summary: stageSummary("score", { default_probability: decision.risk.default_probability }) } }
    : { state: "failed", meta: { summary: "Did not complete -- ML service unavailable or data incomplete" } };
  states.check = decision.compliance
    ? { state: "complete", meta: { summary: stageSummary("check", {
        breach_count: decision.compliance.flags.filter((f) => f.severity === "BREACH").length,
        advisory_count: decision.compliance.flags.filter((f) => f.severity === "ADVISORY").length,
      }) } }
    : { state: "pending", meta: { summary: "Skipped -- risk score unavailable" } };
  states.decide = { state: "complete", meta: { summary: stageSummary("decide", { decision: decision.decision }) } };
  return states;
}

function verdictCard(decision) {
  return el("section", { class: "card card-pad", style: "text-align:center" },
    verdictBadge(decision.decision, { big: true }),
    el("p", { style: "margin:.9rem 0 0;font-size:.875rem;line-height:1.6;color:var(--text-muted)" }, decision.rationale),
    decision.approved_amount_pkr != null
      ? el("div", { style: "margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--border)" },
          el("div", { class: "stat-label" }, "Approved amount"),
          el("div", { class: "stat-value", style: "font-size:1.35rem" }, fmtPKR(decision.approved_amount_pkr)))
      : null,
    // The alert is a flex row, so the list lives inside it rather than being the flex
    // container itself -- list markers don't render on flex items.
    decision.escalation_reasons.length
      ? el("div", { class: "alert alert-warn", style: "margin:.9rem 0 0;text-align:left" },
          el("span", { class: "alert-icon", "aria-hidden": "true" }, "✋"),
          el("ul", { style: "margin:0;padding-left:1.1rem;list-style:disc" },
            ...decision.escalation_reasons.map((r) => el("li", { style: "font-size:.83rem;line-height:1.55" }, r))))
      : null
  );
}

function renderDecision(decision, stageStates) {
  const content = document.getElementById("content");
  content.innerHTML = "";

  const left = el("div", { class: "stack" },
    card("As received", asReceivedPanel(rawDocument), "lift"),
    card("As understood", parsedPanel(decision.parsed), "lift")
  );

  const traceBox = el("div", { class: "stack-sm" });
  const center = el("div", { class: "stack" }, card("Agent trace", traceBox, "lift"));
  renderTrace(traceBox, stageStates || inferStageStatesFromDecision(decision));

  const right = el("div", { class: "stack" },
    verdictCard(decision),
    card("Risk", riskGauge(decision.risk), "lift"),
    card("Compliance", complianceBlock(decision.compliance), "lift"),
    decisionIdParam ? el("div", { class: "card card-pad", style: "display:flex;gap:.5rem" },
      el("button", { id: "accept-btn", class: "btn btn-ok", style: "flex:1" },
        el("span", { "aria-hidden": "true" }, "✓"), "Accept"),
      el("button", { id: "override-btn", class: "btn", style: "flex:1" },
        el("span", { "aria-hidden": "true" }, "✋"), "Override")
    ) : null
  );

  [left, center, right].forEach((col, i) => content.appendChild(rise(col, i)));

  if (decisionIdParam) wireActions(decisionIdParam);
}

function wireActions(decisionId) {
  const acceptBtn = document.getElementById("accept-btn");
  const overrideBtn = document.getElementById("override-btn");

  acceptBtn.addEventListener("click", async () => {
    const ok = await confirmDialog(
      "Accept this recommendation?",
      "The recommendation is recorded as accepted, exactly as it stands. This is appended to the audit trail — it does not alter the original decision row.",
      { confirmLabel: "Accept recommendation", kind: "ok" }
    );
    if (!ok) return;
    acceptBtn.disabled = true;
    try {
      await fetchJSON(`/api/decisions/${encodeURIComponent(decisionId)}/accept`, { method: "POST" });
      toast("Accepted and recorded in the audit trail.", "ok");
    } catch (err) {
      acceptBtn.disabled = false;
      toast("Could not record acceptance: " + err.message, "bad", 7000);
    }
  });

  overrideBtn.addEventListener("click", async () => {
    const reason = await promptDialog(
      "Override this recommendation",
      "Your reason is appended to the audit trail alongside the original decision, which stays on the record unchanged.",
      {
        placeholder: "Why are you overriding this recommendation?",
        label: "Reason for override",
        confirmLabel: "Record override",
        // Same 10-character floor as before, enforced before the request goes out.
        validate: (v) => (v || "").trim().length < 10 ? "Reason must be at least 10 characters." : null,
      }
    );
    if (reason === null) return;
    overrideBtn.disabled = true;
    try {
      await fetchJSON(`/api/decisions/${encodeURIComponent(decisionId)}/override`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason }),
      });
      toast("Override recorded in the audit trail.", "ok");
    } catch (err) {
      overrideBtn.disabled = false;
      toast("Could not record override: " + err.message, "bad", 7000);
    }
  });
}

async function loadRawDocument(id) {
  try {
    const applicant = await fetchJSON(`/api/applicants/${encodeURIComponent(id)}`);
    rawDocument = applicant.raw_document;
  } catch (err) {
    rawDocument = null; // fine -- e.g. applicant exists only via fixture, not yet seeded
  }
}

async function runLive() {
  setTitle(`Application Review — ${applicantIdParam}`);

  // A new applicant from the PDF intake flow (new-application.html) hands its assembled
  // raw_fields/notes/etc. through sessionStorage -- a per-viewer, one-shot handoff, not
  // shared state -- rather than an applicant_id the server can look up itself.
  let sessionApplication = null;
  if (isSessionSource) {
    try {
      sessionApplication = JSON.parse(sessionStorage.getItem("cs_new_application") || "null");
    } catch (e) {
      sessionApplication = null;
    }
  }

  if (sessionApplication) {
    document.getElementById("page-subtitle").textContent = "Running the four agents live on a new applicant…";
    rawDocument = { raw_fields: sessionApplication.raw_fields, notes: sessionApplication.notes };
  } else {
    document.getElementById("page-subtitle").textContent = "Running the four agents live…";
    await loadRawDocument(applicantIdParam);
  }

  const content = document.getElementById("content");
  content.innerHTML = "";
  const center = el("div", { class: "lg:col-span-3" },
    el("div", { style: "max-width:34rem;margin:0 auto" },
      card("Agent trace", el("div", { id: "live-trace", class: "stack-sm", "aria-live": "polite" }))
    )
  );
  content.appendChild(center);

  const stageStates = {};
  STAGES.forEach((s) => stageStates[s.key] = { state: "pending", meta: {} });
  stageStates.analyze.state = "running";
  renderTrace(document.getElementById("live-trace"), stageStates);

  const qsParams = { applicant_id: applicantIdParam };
  if (sessionApplication) {
    qsParams.raw_fields = JSON.stringify(sessionApplication.raw_fields || {});
    if (sessionApplication.notes) qsParams.notes = sessionApplication.notes;
    if (sessionApplication.requested_amount_pkr != null) qsParams.requested_amount_pkr = sessionApplication.requested_amount_pkr;
    if (sessionApplication.is_clean_facility) qsParams.is_clean_facility = "true";
    if (sessionApplication.tenor_months != null) qsParams.tenor_months = sessionApplication.tenor_months;
  }
  const qs = new URLSearchParams(qsParams);
  const source = new EventSource(`/applications/underwrite/stream?${qs.toString()}`);

  // A stage.completed event means the pipeline *reached* that stage, not that it
  // succeeded -- e.g. "score" still fires with default_probability: null when the ML
  // service is down, and "check" still fires with breach_count: 0 when it never ran
  // at all (pipeline.py skips compliance.check() entirely once risk is None). Track
  // that here so the live trace shows a failed/skipped stage honestly as it happens,
  // not as a false green tick.
  let scoreFailed = false;

  source.addEventListener("stage.completed", (ev) => {
    const data = JSON.parse(ev.data);
    let state = "complete";
    if (data.stage === "score" && data.default_probability === null) {
      state = "failed";
      scoreFailed = true;
    } else if (data.stage === "check" && scoreFailed) {
      state = "pending";
    }
    stageStates[data.stage] = {
      state,
      meta: { duration_ms: data.duration_ms, summary: state === "pending" ? "Skipped -- risk score unavailable" : stageSummary(data.stage, data) },
    };
    const nextIdx = STAGES.findIndex((s) => s.key === data.stage) + 1;
    if (nextIdx < STAGES.length && stageStates[STAGES[nextIdx].key].state === "pending") {
      stageStates[STAGES[nextIdx].key].state = "running";
    }
    renderTrace(document.getElementById("live-trace"), stageStates);
  });

  source.addEventListener("underwriting.decided", (ev) => {
    source.close();
    const decision = JSON.parse(ev.data);
    document.getElementById("page-subtitle").textContent = "Run complete.";
    // The live-tracked states already reflect what actually happened; just carry
    // their real durations into the final render instead of re-deriving from scratch.
    renderDecision(decision, stageStates);
    toast(`Run complete — ${decision.decision.replace(/_/g, " ").toLowerCase()}.`, "info");
  });

  source.addEventListener("error", (ev) => {
    source.close();
    let detail = "The run failed or the connection was interrupted.";
    try { detail = JSON.parse(ev.data).detail || detail; } catch (e) {}
    document.getElementById("content").innerHTML = "";
    document.getElementById("content").appendChild(errorState(detail));
  });
}

async function loadStored() {
  document.getElementById("page-subtitle").textContent = "Stored decision (not re-run).";
  const content = document.getElementById("content");
  content.appendChild(skeleton(6));
  try {
    const row = await fetchJSON(`/api/decisions/${encodeURIComponent(decisionIdParam)}`);
    applicantId = row.applicant_id;
    setTitle(`Application Review — ${applicantId}`);
    await loadRawDocument(applicantId);
    renderDecision(row.payload);
  } catch (err) {
    content.innerHTML = "";
    content.appendChild(errorState(err.message));
  }
}

if (shouldRun && applicantIdParam) {
  runLive();
} else if (decisionIdParam) {
  loadStored();
} else {
  document.getElementById("content").appendChild(errorState(
    "No application specified. Go back to the Work Queue and pick or search for one."));
}
</script>
</body>
</html>
