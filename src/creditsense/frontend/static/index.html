<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>CreditSense — Work Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css?v=2" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="app.js?v=2"></script>
</head>
<body>
<a href="#main" class="sr-only">Skip to content</a>

<nav class="nav" aria-label="Main">
  <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">CS</span> CreditSense</a>
  <a href="index.html" class="navlink" aria-current="page">Work Queue</a>
  <a href="regulations.html" class="navlink">Regulations</a>
  <a href="portfolio.html" class="navlink">Portfolio</a>
  <a href="audit.html" class="navlink">Audit Trail</a>
</nav>

<main id="main" class="shell shell-lg">
  <header class="page-head rise">
    <h1 class="h1"><span class="gradient-text">Work Queue</span></h1>
    <p class="lede" style="margin:.5rem 0 0">
      Everything the four agents have decided, and everything they handed back to you.
      Open a case to see how it was reached — as received, as understood, and why.
    </p>
  </header>

  <div id="stats" class="stat-grid" style="margin-bottom:1.4rem"></div>

  <section class="card card-pad rise" style="--i:2;margin-bottom:1.1rem">
    <label class="label" for="search-box">Find an applicant and run underwriting</label>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <input id="search-box" type="text" class="input" style="flex:1 1 16rem;width:auto"
             placeholder="Search applicant ID or sector…" autocomplete="off" />
      <button id="search-btn" class="btn btn-primary">
        <span aria-hidden="true">⌕</span> Find / run
      </button>
      <a href="new-application.html" class="btn">
        <span aria-hidden="true">＋</span> New applicant
      </a>
    </div>
    <div id="search-results" style="margin-top:.9rem"></div>
  </section>

  <div class="tabs rise" role="tablist" aria-label="Queue filter" style="--i:3;margin-bottom:1rem">
    <button data-tab="escalated" class="tab" role="tab" aria-selected="true" aria-controls="queue-list">
      Needs You <span id="needs-you-count" class="count-pill hidden"></span>
    </button>
    <button data-tab="decided" class="tab" role="tab" aria-selected="false" aria-controls="queue-list">Recently Decided</button>
    <button data-tab="all" class="tab" role="tab" aria-selected="false" aria-controls="queue-list">All Applications</button>
  </div>

  <div id="queue-list" role="tabpanel" aria-live="polite"></div>
</main>

<script>
const { el, rise, fetchJSON, skeleton, emptyState, errorState, verdictBadge,
        statTile, countUp, fmtPKR, fmtPKRShort, fmtDate } = CS;

let activeTab = "escalated";

function setActiveTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab").forEach((btn) => {
    btn.setAttribute("aria-selected", String(btn.dataset.tab === tab));
  });
  loadQueue();
}

function statusForTab(tab) {
  if (tab === "escalated") return "escalated";
  if (tab === "decided") return null; // filtered client-side to success/failed below
  return null;
}

// Headline numbers, derived only from fields /api/decisions already returns. The
// caption says "last 200" because that is literally the window queried -- a stat tile
// that quietly implies "all time" would be a lie the officer can't see.
async function loadStats() {
  const host = document.getElementById("stats");
  host.appendChild(skeleton(1));
  try {
    const rows = await fetchJSON("/api/decisions?limit=200");
    const runs = rows.filter((r) => r.action === "underwriting_decision");
    const needs = runs.filter((r) => r.status === "escalated").length;
    const approved = runs.filter((r) => r.decision === "APPROVE");
    const declined = runs.filter((r) => r.decision === "DECLINE").length;
    const volume = approved.reduce((sum, r) => sum + (r.approved_amount_pkr || 0), 0);

    host.innerHTML = "";
    const tiles = [
      ["Needs your review", needs, "escalated to a human", (v) => String(Math.round(v))],
      ["Approved", approved.length, "auto-approved within guardrail", (v) => String(Math.round(v))],
      ["Declined", declined, "failed risk or compliance", (v) => String(Math.round(v))],
      ["Approved volume", volume, "across the last 200 records", fmtPKRShort],
    ];
    tiles.forEach(([label, value, sub, fmt], i) => {
      const tile = rise(statTile(label, "—", sub), i);
      host.appendChild(tile);
      countUp(tile.querySelector(".stat-value"), value, fmt);
    });
  } catch (err) {
    host.innerHTML = "";
    host.appendChild(errorState("Could not load the summary: " + err.message));
  }
}

async function loadQueue() {
  const listEl = document.getElementById("queue-list");
  listEl.innerHTML = "";
  listEl.appendChild(skeleton(5));
  try {
    const status = statusForTab(activeTab);
    const url = "/api/decisions?limit=100" + (status ? `&status=${status}` : "");
    let rows = await fetchJSON(url);
    if (activeTab === "decided") {
      rows = rows.filter((r) => r.status === "success" && r.action === "underwriting_decision");
    }
    if (activeTab === "escalated") {
      const badge = document.getElementById("needs-you-count");
      badge.textContent = rows.length;
      badge.classList.toggle("hidden", rows.length === 0);
    }
    listEl.innerHTML = "";
    if (rows.length === 0) {
      listEl.appendChild(emptyState(
        activeTab === "escalated" ? "Nothing needs your attention right now." : "No applications in this view yet.",
        activeTab === "escalated" ? "✓" : "◍"
      ));
      return;
    }
    const table = el("div", { class: "card list" });
    rows.forEach((r, i) => table.appendChild(rise(renderRow(r), i)));
    listEl.appendChild(table);
  } catch (err) {
    listEl.innerHTML = "";
    listEl.appendChild(errorState(err.message));
  }
}

function renderRow(r) {
  const href = `review.html?id=${encodeURIComponent(r.id)}`;
  return el(
    "a",
    { href, class: "row" },
    el("div", { style: "display:flex;align-items:center;gap:.9rem;min-width:0" },
      r.decision ? verdictBadge(r.decision) : el("span", { class: "badge" }, r.status),
      el("div", { style: "min-width:0" },
        el("div", { class: "row-title" }, r.applicant_id || "(unknown applicant)"),
        el("div", { class: "row-sub clamp-2" }, r.rationale || "")
      )
    ),
    el("div", { class: "row-meta" },
      el("div", { class: "num", style: "color:var(--text);font-weight:600" }, fmtPKR(r.approved_amount_pkr)),
      el("div", { class: "dim" }, fmtDate(r.created_at))
    )
  );
}

async function runSearch() {
  const q = document.getElementById("search-box").value.trim();
  const results = document.getElementById("search-results");
  results.innerHTML = "";
  if (!q) return;
  results.appendChild(skeleton(2));
  try {
    const applicants = await fetchJSON(`/api/applicants?search=${encodeURIComponent(q)}&limit=8`);
    results.innerHTML = "";
    if (applicants.length === 0) {
      results.appendChild(emptyState(`No applicants matching "${q}".`, "⌕"));
      return;
    }
    const box = el("div", { class: "card list" });
    applicants.forEach((a, i) => {
      box.appendChild(rise(el(
        "a",
        { href: `review.html?applicant_id=${encodeURIComponent(a.applicant_id)}&run=1`, class: "row" },
        el("span", { class: "row-title" }, a.applicant_id),
        el("span", { style: "display:flex;align-items:center;gap:.7rem" },
          a.sector ? el("span", { class: "badge" }, a.sector) : null,
          el("span", { class: "dim", style: "font-size:.8rem" }, "Run →")
        )
      ), i));
    });
    results.appendChild(box);
  } catch (err) {
    results.innerHTML = "";
    results.appendChild(errorState(err.message));
  }
}

document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
});
document.getElementById("search-btn").addEventListener("click", runSearch);
document.getElementById("search-box").addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

loadStats();
setActiveTab("escalated");
</script>
</body>
</html>
